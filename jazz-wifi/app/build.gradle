plugins { id 'com.android.application' }

android {
    namespace 'com.jazzwifi.local'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jazzwifi.local'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
