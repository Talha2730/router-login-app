name: Build Unsigned Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unsigned-release.yml'
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager is missing"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build actual release APK (not debuggable)
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'35'"
          if "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::This APK is debuggable"
            exit 1
          fi

      - name: Upload unsigned release (for separate secure signing)
        uses: actions/upload-artifact@v4
        with:
          name: DLink-WiFi-Unsigned-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
