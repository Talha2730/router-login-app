name: Build Personal GPS Map Camera APK
on:
  push:
    branches: [personal-gps-map-camera]
    paths:
      - 'gps-payload/**'
      - '.github/workflows/build-personal-gps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out GPS source branch
        uses: actions/checkout@v4
      - name: Decode independent GPS Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gps-app
          cat gps-payload/part-*.b64 | base64 -d > /tmp/personal-gps-source.tar.xz
          echo 'a75bc5a09d4c706182102b1d7997e3666a3ea948e96a6b30cf633a0d8a4dc7a6  /tmp/personal-gps-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/personal-gps-source.tar.xz -C gps-app
          test -s gps-app/app/src/main/java/com/personal/gpsmapcamera/MainActivity.java
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build personal GPS APK
        run: |
          set -euo pipefail
          cd gps-app
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify installable APK
        run: |
          APK=gps-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-GPS-Map-Camera-APK
          path: gps-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
