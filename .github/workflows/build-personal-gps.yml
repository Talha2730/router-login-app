name: Build Personal GPS Map Camera APK
on:
  push:
    branches: [personal-gps-map-camera]
    paths:
      - 'gps-payload/**'
      - '.github/workflows/build-personal-gps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out GPS source branch
        uses: actions/checkout@v4
      - name: Decode independent GPS Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gps-app
          cat gps-payload/part-*.b64 | base64 -d > /tmp/personal-gps-source.tar.xz
          echo 'a75bc5a09d4c706182102b1d7997e3666a3ea948e96a6b30cf633a0d8a4dc7a6  /tmp/personal-gps-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/personal-gps-source.tar.xz -C gps-app
          test -s gps-app/app/src/main/java/com/personal/gpsmapcamera/MainActivity.java
      - name: Fix GPS EXIF compatibility for platform Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("gps-app/app/src/main/java/com/personal/gpsmapcamera/MainActivity.java")
          code=source.read_text()
          old="exif.setLatLong(opts.latitude,opts.longitude);"
          new="double[] gpsCoordinates={opts.latitude,opts.longitude};\n                String[] gpsFractions=new String[2];\n                for(int gpsIndex=0;gpsIndex<2;gpsIndex++){\n                    double coordinate=Math.abs(gpsCoordinates[gpsIndex]);\n                    int degrees=(int)coordinate;\n                    double minutesFloat=(coordinate-degrees)*60.0;\n                    int minutes=(int)minutesFloat;\n                    long secondsThousandths=Math.round((minutesFloat-minutes)*60000.0);\n                    gpsFractions[gpsIndex]=degrees+\"/1,\"+minutes+\"/1,\"+secondsThousandths+\"/1000\";\n                }\n                exif.setAttribute(ExifInterface.TAG_GPS_LATITUDE,gpsFractions[0]);\n                exif.setAttribute(ExifInterface.TAG_GPS_LATITUDE_REF,opts.latitude>=0?\"N\":\"S\");\n                exif.setAttribute(ExifInterface.TAG_GPS_LONGITUDE,gpsFractions[1]);\n                exif.setAttribute(ExifInterface.TAG_GPS_LONGITUDE_REF,opts.longitude>=0?\"E\":\"W\");"
          assert code.count(old)==1, "Expected GPS EXIF call not found"
          source.write_text(code.replace(old,new))
          PY
      - name: Apply GPS video and search upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 gps-work/upgrade_gps_v11.py gps-app
          grep -q 'searchMapLocation' gps-app/app/src/main/java/com/personal/gpsmapcamera/MainActivity.java
          grep -q 'videoStamp' gps-app/app/src/main/java/com/personal/gpsmapcamera/StampRenderer.java
      - name: Apply v1.2 reference GPS photo-stamp design
        run: python3 gps-payload/apply-reference-v12.py
      - name: Apply v1.3 video-style home screen
        run: python3 gps-payload/apply-video-home-v13.py
      - name: Apply v1.4 automatic GPS and pinch zoom
        run: python3 gps-payload/apply-gps-search-pinch-v14.py
      - name: Apply v1.5 adaptive address bar and independent font sizes
        run: python3 gps-payload/apply-dynamic-stamp-v15.py
      - name: Apply v1.6 editable map search and GPS prompts
        run: python3 gps-payload/apply-map-search-v16.py
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build personal GPS APK
        run: |
          set -euo pipefail
          cd gps-app
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify installable APK
        run: |
          APK=gps-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-GPS-Map-Camera-APK
          path: gps-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
